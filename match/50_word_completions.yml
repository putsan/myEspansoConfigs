  - trigger: "оф"
    replace: "офіційні"
    word: true

  - trigger: "анг+"
    replace: "англомовну"
  - trigger: "Анг+"
    replace: "Англійську"
  - trigger: "укр+"
    replace: "українська"
  - trigger: "укр+"
    replace: "українську"
  - trigger: "укр+"
    replace: "українській"
  - trigger: "утп"
    replace: "ENG"

  - trigger: "кон+"
    replace: "конфігурацію"
  - triggers: ["конц+", "кон+"]
    replace: "концентрації (без сповіщень)"
  - trigger: "реа+"
    replace: "реалізовано"
  - trigger: "смарт+"
    replace: "смартфон"
  - trigger: "альт+"
    replace: "альтернативні"
