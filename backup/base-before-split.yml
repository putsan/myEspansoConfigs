# espanso match file

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# You can use this file to define the base matches (aka snippets)
# that will be available in every application when using espanso.

# Matches are substitution rules: when you type the "trigger" string
# it gets replaced by the "replace" string.

# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  # Simple text replacement
  - trigger: ":espanso"
    replace: "Hi there!"

  # NOTE: espanso uses YAML to define matches, so pay attention to the indentation!

  # But matches can also be dynamic:

  # Print the current date
  - triggers: [":date", ":today"]
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%d %m %Y"

  # Print the output of a shell command
  - trigger: ":shell"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "echo 'Hello from your shell'"

  # And much more! For more information, visit the docs: https://espanso.org/docs/

  # MY Matches
  # ZERO for now

  # Important symbols! (most on Cyrillic)
  - trigger: "№"
    replace: "#"
    word: true
  - trigger: "№№"
    replace: "##"
    word: true
  - trigger: "№№№"
    replace: "###"
    word: true
  - trigger: "№№№№"
    replace: "####"
    word: true
  - trigger: "№№№№№"
    replace: "#####"
    word: true
  - trigger: "№№№№№№"
    replace: "######"
    word: true

  - trigger: "--"
    replace: "—"
    word: true
  - trigger: ":грн"
    replace: "₴"
  - triggers: ["ʼʼ", '"+']
    replace: "@"

  # Emojis (most of for Obsidian)
  - triggers: [":100", "100+"]
    replace: "💯"
  - triggers: [":^", "ршп+", "р+"]
    replace: "🔺" # Obsidian
    word: true
  - triggers: ["ррр", hhh"]
    replace: "⏫"
  - triggers: ["ььь", "mmm"]
    replace: "🔼"
  - triggers: ["lll", "ддд"]
    replace: "🔽"
  - trigger: "д+"
    replace: "⏬"
  - triggers: ["dat+", "data+"]
    replace: "dataview"

  # Obsidian
  - triggers: ["[[l", "[[л", "[[д"]
    replace: " | [[fname|alt]]"
  # - triggers: ["»»", ")_", ")+"] # isn't work first((
  #   replace: ">"  # Don't needed anymore, [Alt + 7] combination are better, dont know before about))
  - triggers: ["й»", "йЮ", "q>", "йю", "ЙЮ"]
    replace: "> [!$|$]"
  - triggers: ["-t", "-е"]
    replace: "- [ ]"
    word: true
  - triggers: ["log+", "банка+"]
    replace: "log::💌"

  # App NAMES
  - triggers: ["gh", "GH", "гх", "ГХ", "пр+", "пр="]
    replace: "GitHub"
    word: true
  - trigger: "місщву"
